name: CI y seguridad (SAST + Docker + DAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q

      - name: Preparar carpeta de reportes
        run: mkdir -p reports

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: SAST - Analizar Python con Semgrep
        run: semgrep scan --config p/python --json --output reports/semgrep.json app/

      - name: Construir imagen Docker
        run: docker build -t devsecops-lab:ci .

      - name: Trivy - Analizar vulnerabilidades de la imagen Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-lab:ci
          format: json
          output: reports/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: '0'

      - name: Iniciar aplicación para DAST
        run: docker compose up --build -d

      
      - name: Verificar que la aplicación esté lista
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker compose ps -q web)"

          if [ -z "$container_id" ]; then
            echo "ERROR: No se encontró el contenedor web"
            docker compose ps -a
            docker compose logs --no-color web || true
            exit 1
          fi

          echo "Esperando a que el contenedor esté saludable..."

          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"
            running="$(docker inspect --format '{{.State.Running}}' "$container_id")"

            echo "Intento $attempt/40: running=$running, health=$status"

            if [ "$running" != "true" ]; then
              echo "ERROR: El contenedor se detuvo"
              docker compose logs --no-color web || true
              exit 1
            fi

            if [ "$status" = "healthy" ]; then
              echo "Contenedor saludable"
              break
            fi

            sleep 3
          done

          echo "Verificando conexión HTTP..."

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8080/health; then

              echo "Aplicación lista para ejecutar OWASP ZAP"
              exit 0
            fi

            echo "Intento HTTP $attempt/20"
            sleep 3
          done

          echo "ERROR: La aplicación no responde"
          docker compose ps -a
          docker compose logs --no-color --tail=100 web || true
          exit 1


      - name: DAST - ZAP Baseline (análisis pasivo)
        run: |
          # La imagen de ZAP utiliza un usuario no privilegiado.
          # Solo este directorio temporal del runner recibe permisos de escritura.
          chmod 777 reports
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -m 1 -I \
            -J zap-report.json \
            -r zap-report.html

      - name: Detener aplicación del laboratorio
        if: always()
        run: docker compose down --remove-orphans

      - name: Guardar reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-seguridad
          path: reports/
          if-no-files-found: warn
          retention-days: 14

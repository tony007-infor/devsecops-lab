name: CI y seguridad (SAST + Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q

      - name: Preparar carpeta de reportes
        run: mkdir -p reports

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: SAST - Analizar Python con Semgrep
        run: semgrep scan --config p/python --json --output reports/semgrep.json app/

      - name: Construir imagen Docker
        run: docker build -t devsecops-lab:ci .

      - name: Trivy - Analizar vulnerabilidades de la imagen Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-lab:ci
          format: json
          output: reports/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: '0'

      - name: Guardar reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-seguridad
          path: reports/
          if-no-files-found: warn
          retention-days: 14